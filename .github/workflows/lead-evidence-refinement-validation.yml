name: Lead evidence refinement validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Typecheck backend and tests
        run: npm run typecheck
      - name: Run evidence and qualification regressions
        run: >-
          node --import tsx --test
          tests/contact-form-evidence.test.ts
          tests/contact-form-trust.test.ts
          tests/first-party-research.test.ts
          tests/lead-assessment.test.ts
          tests/qualify-leads.test.ts

  ops-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops-console/package-lock.json
      - name: Install console dependencies
        run: npm ci
      - name: Typecheck console
        run: npm run typecheck
      - name: Run console unit tests
        run: npm run test:unit
      - name: Build console
        run: npm run build
