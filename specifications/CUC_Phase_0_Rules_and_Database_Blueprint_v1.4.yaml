clean_up_central_booking_system:
  document:
    name: Phase 0 — Rules and Database Blueprint
    status: approved_pending_production_verification
    purpose: Source-of-truth specification for building Clean Up Central's quote generator, manual-quotation 
      journeys, internal quote-review workflow and future custom booking system.
    source_priority:
      - Newest explicit founder decision recorded in the Clean Up Central Decision Log
      - Clean Up Central Decision Log for approved decisions awaiting document synchronisation
      - Newest approved Founder Operations Handbook for services, pricing, customer policy and operations
      - This Phase 0 blueprint v1.4 for Build 1 implementation rules
      - Highest-version AmirahOS for collaboration standards and authority pointers, not duplicated prices
      - Verified production behaviour and current main-branch code as implementation evidence only
      - Older conversations and files
    version: '1.4'
    last_updated: '2026-08-03'
    supersedes: Phase 0 v1.3 and all earlier conflicting Phase 0 rules
    supersession_rules:
      - Room Selection is not a top-level journey.
      - Selected Rooms is a cleaning scope within Residential Standard or Deep Clean.
      - All earlier general Selected Rooms minimum-spend rules are revoked. The only Selected Rooms minimum is
        the £40 minimum for bookings consisting exclusively of Hallways and/or Stairs.
      - All BookingKoala references are obsolete and must be ignored.
      - The approved implementation uses the exported React frontend with Wix-managed Headless and Wix 
        business services behind it; the quote generator must not be rebuilt as a Wix Studio Multi-State Box.
      - Specialist and outsourced-supplier Property Support services are not offered in Phase 0 and must not 
        be displayed or implied in the customer journey.
      - The normal required upfront payment is 50%; same-day bookings and bookings made less than 24 hours 
        before the earliest confirmed arrival-window time require 100%.
      - Eligible new clients receive the 15% first-clean discount, but Selected Rooms is excluded. For other
        automatically priced services, discount only the cleaning-service charge; do not discount extras, travel,
        condition, same-day, parking, congestion, tolls, consumables or separately approved costs.
      - Flexible Hourly Cleaning is paid in full at booking.
      - The remaining balance is due on the service date no later than two hours before the earliest time in 
        the confirmed arrival window.
      - The no-access wait is 30 minutes. A verified no-access event may retain the full booking value.
    authority_by_subject:
      live_decisions: The Decision Log temporarily governs approved founder decisions made after the latest 
        handbook or build specification.
      commercial_policy: The newest approved Founder Operations Handbook governs services, prices, payment 
        terms, cancellations, operating standards, quality and safety.
      build_1_implementation: This Phase 0 blueprint governs how the completed website and quote generator 
        implement approved commercial policy.
      collaboration_method: AmirahOS governs the expected reasoning, communication, evidence and collaboration
        quality; it must point to commercial sources rather than duplicate their figures.
      implementation_evidence: Production behaviour and current code prove what is implemented. They do not 
        silently override approved business policy.
    implementation_note: Build 1 remains officially complete. Version 1.4 is a controlled maintenance 
      amendment for payment, discount and operational-policy changes approved after the original launch.
  scope:
    included:
      - Instant quote questions and conditional journeys
      - Pricing and calculation rules
      - Manual-review and approval rules
      - Deposit, balance, cancellation and rescheduling rules
      - Service-area calculation
      - Quote and booking statuses
      - Notification triggers
      - Database collections, fields and relationships
      - Reserved structure for future cleaner assignment
      - Property Support custom-quotation journey
      - Commercial custom-quotation journey
      - Flexible Hourly Cleaning rules and payment treatment
    deferred:
      - Cleaner matching and assignment automation
      - Cleaner acceptance workflow
      - Cleaner mobile portal
      - Advanced CRM automations
      - Google Sheets job tracking
      - Full calendar integration
      - Automatic invoicing for commercial contracts
  customer_quote_journey:
    step_1_quote_category:
      question: What can we help you with?
      selection_type: single
      options:
        - Residential Cleaning
        - Airbnb Turnover
        - Commercial Cleaning
        - Property Support
      rule: Room Selection must not appear as a separate top-level option.
    residential_branch:
      property_type:
        question: What type of property is it?
        selection_type: single
        options:
          - House
          - Flat/Apartment
      cleaning_service:
        question: Which cleaning service do you need?
        selection_type: single
        options:
          - Standard Clean
          - Deep Clean
          - End of Tenancy
      standard_and_deep_scope:
        display_when: Standard Clean or Deep Clean is selected
        question: How much of the property would you like cleaned?
        selection_type: single
        options:
          - Whole Property
          - Selected Rooms
        mutually_exclusive: true
      whole_property:
        collect:
          - Property size
          - Exact bedroom count where required
          - Bathroom count
        property_size_options:
          - Studio
          - 1 Bedroom
          - 2 Bedrooms
          - 3 Bedrooms
          - 4+ Bedrooms
        four_plus_follow_up: Ask for the exact number of bedrooms
        bathroom_rule: The base price includes one bathroom. Add the automatic additional-bathroom fee for 
          each bathroom after the first.
        then_show:
          - Eligible extras
          - Address and appointment
          - Customer details
          - Estimated quote
          - Submit for review
      selected_rooms:
        collect_room_quantities: true
        room_options:
          - Bathroom
          - Bedroom
          - Kitchen
          - Living Room
          - Hallway
          - Stairs
        cleaning_level_rule: Inherit the Standard or Deep service selected earlier. A customer cannot mix 
          Standard and Deep room prices in one quote.
        calculation:
          - Multiply each room quantity by the applicable Standard or Deep room price
          - Add all selected-room line totals
          - If the booking consists exclusively of Hallways and/or Stairs and the line total is below £40, add
            a minimum-booking adjustment so the Selected Rooms subtotal equals £40
          - Add eligible extras
          - Apply the normal travel rules
          - Do not apply the new-customer discount to Selected Rooms.
          - Keep the Hallway/Stairs-only minimum and normal travel rules unchanged.
        minimum_booking_value: 40
        minimum_booking_rule: The £40 minimum applies only when the booking consists exclusively of one or 
          more Hallways and/or Stairs. It does not apply when at least one Bathroom, Bedroom, Kitchen or 
          Living Room is selected. If the Hallway/Stairs-only line total is already £40 or more, charge the 
          calculated total.
        additional_bathroom_rule: Do not add a separate additional-bathroom fee. Each selected bathroom is 
          already priced individually.
        travel_rules_apply: true
        new_customer_discount_eligible: false
        condition_rule: Room prices are base prices and may be revised following review if the room condition 
          materially differs from the information supplied.
        then_show:
          - Eligible extras
          - Address and appointment
          - Travel calculation
          - Customer details
          - Estimated quote
          - Submit for review
      end_of_tenancy:
        display_when: End of Tenancy is selected
        result: custom_quote_required
        manual_review: true
        photos_required: true
        collect:
          - Property details
          - Condition details
          - Relevant property photos
          - Address and appointment
          - Customer details
        hide:
          - Whole Property or Selected Rooms scope question
          - Optional extras
          - Instant price
          - Discount calculation
          - Deposit estimate
        customer_message: Custom Quotation Required
      flexible_hourly_cleaning:
        status: approved_service_not_yet_exposed_as_a_standard_quote_generator_branch
        positioning: A controlled time-based alternative for budget-led or partial-scope customers. 
          Fixed-price cleaning remains the primary outcome-based offer.
        payment: 100% due at booking.
        customer_priority_list_required: true
        completion_rule: Tasks are completed in priority order within purchased time. Completion of the full 
          list is not guaranteed.
        time_rule: Work stops when purchased time ends unless extra time is approved and paid before the 
          extension.
        unused_time_rollover: false
    airbnb_branch:
      service_type: Airbnb Turnover
      collect:
        - Property size
        - Exact bedroom count where required
        - Bathroom count
        - Condition
        - Eligible extras
        - Address and appointment
        - Customer details
      property_size_options:
        - Studio
        - 1 Bedroom
        - 2 Bedrooms
        - 3 Bedrooms
        - 4+ Bedrooms
      four_plus_follow_up: Ask for the exact number of bedrooms
      condition_page:
        position: Immediately after number of bathrooms
        options:
          Good:
            fee_gbp: 0
            manual_review: false
          Moderate:
            fee_gbp: 10
            manual_review: false
          Dirty:
            provisional_fee_gbp: 20
            manual_review: true
            photos_required: true
            fee_revisable: true
            revision_basis: Severity and evidence supplied
            customer_message: The displayed estimate is provisional and the Dirty condition charge may be 
              revised after review.
      result: estimated_quote_then_submit_for_review
    commercial_branch:
      result: custom_quote_required
      manual_review: true
      question_order:
        - Describe the premises
        - Describe the current condition
        - Describe the cleaning requirements
        - Choose One-off or Recurring
        - If Recurring, choose frequency
        - Add preferred days and times
        - Describe access and operational requirements
        - Upload supporting photos or documents
        - Property address and preferred start date
        - Company and contact details
      arrangement_options:
        - One-off
        - Recurring
      recurring_frequency_options:
        - Daily
        - Five times weekly
        - Three times weekly
        - Twice weekly
        - Weekly
        - Fortnightly
        - Monthly
        - Ad hoc
        - Other / Not sure
      hide:
        - Instant price
        - Discount calculation
        - Deposit estimate
    property_support_branch:
      result: custom_quote_required
      manual_review: true
      support_service_options:
        - Key Holding
        - Property Inspection
        - Contractor Access
        - Inventory Check
        - Emergency Attendance
        - Not Sure
      multiple_services_allowed: true
      collect:
        - Property type
        - Property address
        - Postcode
        - Number of properties
        - Occupancy status
        - Access arrangements
        - Description of support required
        - One-off or Recurring
        - Recurring frequency when applicable
        - Preferred start date
        - Required completion date for one-off requests
        - Standard, urgent or emergency urgency
        - Preferred contact method
        - Customer and company details
        - Supporting photos or documents
        - Access notes and additional comments
      arrangement_options:
        - One-off
        - Recurring
      recurring_frequency_options:
        - Weekly
        - Fortnightly
        - Monthly
        - Ad hoc
        - Other
      occupancy_status_options:
        - Occupied
        - Vacant
        - Short-let / holiday let
        - Other / not sure
      outsourced_supplier_services_offered: false
      hide:
        - Bedrooms
        - Bathrooms
        - Cleaning type
        - Cleaning add-ons
        - Instant price
        - Discount calculation
        - Deposit estimate
      customer_message: Property Support services are priced according to the property, responsibility, 
        frequency, access requirements and urgency. Submit the request for a tailored quotation.
    extras_page:
      standard_and_deep:
        - Oven
        - Fridge
        - Interior Windows
        - Grout Cleaning
      airbnb_additional_extras:
        - Laundry
        - Standard Consumables Package
      end_of_tenancy:
        show_extras: false
        message: End-of-tenancy cleaning is custom quoted and standard internal cleaning extras are included 
          subject to the approved scope.
    shared_property_and_appointment_details:
      - Address
      - Postcode
      - Preferred date
      - Preferred arrival window
      - Parking details
      - Pets on property
      - Access notes where relevant
    customer_details:
      - Full name
      - Email address
      - Phone number
      - Company or agency name where applicable
      - Customer type where applicable
    result_page:
      instant_estimate_branches:
        - Residential Standard — Whole Property
        - Residential Standard — Selected Rooms
        - Residential Deep — Whole Property
        - Residential Deep — Selected Rooms
        - Airbnb Turnover
      manual_quote_branches:
        - End of Tenancy
        - Commercial Cleaning
        - Property Support
      automatic_breakdown:
        - Base whole-property price or selected-room total
        - Additional bathrooms where applicable
        - Airbnb condition fee where applicable
        - Extras
        - Travel fee
        - Discount if eligible
        - Estimated total
      primary_button: Submit quote for review
      booking_warning: An estimate is not a confirmed booking. The date is secured only after approval and 
        receipt of the required upfront payment.
  pricing:
    currency: GBP
    whole_property:
      standard_clean:
        studio: 80
        1_bedroom: 80
        2_bedrooms: 110
        3_bedrooms: 150
        4_plus_rule: 3-bedroom price + £20 for each bedroom above 3
      deep_clean:
        studio: 180
        1_bedroom: 180
        2_bedrooms: 235
        3_bedrooms: 300
        4_plus_rule: 3-bedroom price + £30 for each bedroom above 3
      airbnb_turnover:
        base_price_rule: Use the Standard Clean price for the selected property size
        display_prices_gbp:
          studio: 80
          1_bedroom: 80
          2_bedrooms: 110
          3_bedrooms: 150
          4_plus_rule: 3-bedroom price + £20 for each bedroom above 3
        new_customer_discount_eligible: true
        condition_fees_gbp:
          Good: 0
          Moderate: 10
          Dirty: 20
        dirty_condition_rule:
          fee_status: provisional
          photos_required: true
          manual_review_required: true
          revisable_based_on_severity: true
          estimate_must_be_labelled_provisional: true
      end_of_tenancy:
        pricing: custom_quote
        manual_review: true
        photos_required: true
    bathrooms:
      whole_property:
        included_in_base_price: 1
        additional_bathroom_fee_gbp: 20
        rule: For Whole Property quotes, add £20 for each bathroom after the first.
      selected_rooms:
        additional_bathroom_fee_gbp: 0
        rule: Do not add a separate bathroom fee. Every selected bathroom is individually priced using the 
          Selected Rooms table.
    extras:
      oven:
        price_gbp: 50
        quantity: one or more ovens
      fridge:
        price_gbp: 25
        quantity: one or more fridge interiors
      interior_windows:
        price_gbp: 10
        unit: per window
      grout_cleaning:
        price_gbp: 40
        unit: per bathroom or tiled area
      airbnb_laundry:
        price_gbp: 10
        unit: per load
      airbnb_standard_consumables_package:
        price_gbp: 20
        purchase_allowance_cap_gbp:
        includes:
          - Toilet rolls
          - Bin liners
          - Washing-up liquid
          - Hand soap
          - Basic tea
          - Basic coffee
          - Sugar
        rules:
          - The customer pays £20 for the defined Standard Consumables Package.
          - The internal target purchase cost is approximately £10.
          - Premium brands and unusual quantities are not automatically included.
          - Requests outside the defined package require customer approval and separate pricing.
          - Higher consumables packages may be introduced later.
        internal_only:
          target_purchase_cost_gbp: 10
          do_not_show_customer: true
        customer_price_gbp: 20
        customer_promise: Defined standard package contents, not a guaranteed £20 retail-value allowance.
    discounts:
      new_customer:
        percentage: 15
        customer_rule: Apply once to every new client's first eligible service. Automatically priced services 
          apply the discount during calculation; custom-quoted services must include it explicitly in the 
          approved quotation.
        automatic_eligibility:
          - Residential Standard Clean — Whole Property
          - Residential Deep Clean — Whole Property
          - Airbnb Turnover
          - Flexible Hourly Cleaning when quoted through an approved calculation
        discount_base: Cleaning-service charge only. Whole Property includes base cleaning plus automatic
          additional-bathroom charges. Flexible Hourly Cleaning includes booked cleaner-time charges. Selected
          Rooms is excluded from the new-customer discount.
        excluded_from_discount:
          - Optional extras and add-ons
          - Airbnb condition fees
          - Travel fees
          - Same-day charges
          - Parking charges
          - Congestion charges
          - Tolls
          - Consumables and separately approved costs
        not_eligible:
          - Residential Selected Rooms scope
        manual_quote_services: End of Tenancy, Commercial Cleaning and Property Support remain custom quoted, 
          but a verified new client must receive the 15% discount on the eligible service charge within the 
          approved quotation.
    charges:
      same_day:
        automatic_quote: true
        manual_review: true
        bands_gbp:
          - notice: More than 7 hours
            fee_gbp: 25
          - notice: More than 6 hours and up to 7 hours
            fee_gbp: 30
          - notice: More than 5 hours and up to 6 hours
            fee_gbp: 35
          - notice: More than 4 hours and up to 5 hours
            fee_gbp: 40
          - notice: At least 3.5 hours and up to 4 hours
            fee_gbp: 45
          - notice: Less than 3.5 hours or request made after 21:00
            fee_gbp: 50
        minimum_request_notice_hours: 3
        below_minimum_notice: Manual review; availability is not guaranteed.
      parking:
        rule: Charge at cost
        discountable: false
      congestion_and_tolls:
        rule: Charge at cost
        discountable: false
    calculation_order:
      - Select the whole-property base price, calculate the selected-room line total, or calculate the booked 
        Flexible Hourly Cleaning time charge
      - For Whole Property only, add automatic additional-bathroom charges
      - For Hallway/Stairs-only Selected Rooms, add any minimum adjustment before other charges
      - For a verified new client, calculate 15% of the eligible cleaning-service charge and subtract that
        discount, except where the service uses the Selected Rooms scope
      - Add the Airbnb condition fee where relevant
      - Add selected extras
      - Add the travel fee
      - Add same-day charges where relevant
      - Add non-discountable parking, congestion, toll and separately approved costs
      - Calculate the estimated total
      - Calculate the required upfront payment
      - Calculate the remaining balance and deadline
    rounding: Round monetary values to two decimal places
    quote_snapshot_rule: Save the full calculation breakdown and pricing-rule version on the quote. Future 
      price changes must not alter an existing submitted or approved quote.
    selected_rooms:
      journey_position: Residential Cleaning > Standard or Deep > Selected Rooms
      standard:
        Bathroom: 40
        Bedroom: 30
        Kitchen: 40
        Living Room: 40
        Hallway: 20
        Stairs: 25
      deep:
        Bathroom: 55
        Bedroom: 50
        Kitchen: 70
        Living Room: 70
        Hallway: 30
        Stairs: 40
      rules:
        multiple_room_types: true
        quantities_allowed: true
        cleaning_level_inherited_from_selected_service: true
        mixed_standard_and_deep_not_allowed: true
        calculation: Multiply each room quantity by the applicable Standard or Deep price and add the line 
          totals.
        hallway_unit: One connected hallway or landing area on one floor
        stairs_unit: One continuous flight of stairs between two floors
        minimum_booking_value_gbp: 40
        minimum_booking_value_applies: Only when the booking consists exclusively of Hallways and/or Stairs
        minimum_adjustment_rule: If the Hallway/Stairs-only line total is below £40, add the difference as a 
          room minimum adjustment. If any Bathroom, Bedroom, Kitchen or Living Room is selected, do not apply 
          the minimum.
        travel_rules_apply: true
        new_customer_discount_eligible: false
        additional_bathroom_fee_applies: false
        condition_rule: Prices are base prices and may be revised after review where the supplied room 
          condition does not reflect the work required.
        new_customer_discount_rule: Selected Rooms is not eligible for the new-customer discount.
    property_support:
      quotation_method: manual_custom_quotation
      instant_price_displayed: false
      deposit_estimate_displayed: false
      pricing_usage: Internal base rates for preparing tailored quotations. Final pricing may vary according 
        to responsibility, property, frequency, access, waiting time, urgency and scope.
      key_services:
        key_holding_setup:
          price_gbp: 35
          unit: per property
          includes: Secure key registration, storage and management
        key_collection_or_return:
          price_gbp: 20
          unit: per visit within the standard service area
        out_of_hours_key_attendance:
          price_gbp: 55
          unit: per visit
      property_inspections:
        basic:
          price_gbp: 35
          scope: 15–20 minute visual inspection
        standard:
          price_gbp: 50
          scope: Photographs and written observations
        detailed:
          price_gbp: 75
          scope: Extended report with photographs and observations/recommendations within scope
        move_in_or_move_out:
          price_gbp: 90
      inventory_checks:
        studio: 55
        1_bedroom: 75
        2_bedrooms: 95
        3_bedrooms: 120
        additional_bedroom_gbp: 20
      property_access:
        contractor_access_visit:
          price_gbp: 35
          included_onsite_minutes: 30
        additional_waiting_time:
          price_gbp: 15
          unit: each additional 30 minutes
        out_of_hours_access_supplement_gbp: 25
        emergency_attendance:
          business_hours_gbp: 65
          evenings_19_00_to_22_00_gbp: 85
          overnight_or_bank_holidays_gbp: 120
          included_waiting_minutes: 30
          additional_waiting_gbp: 20
          additional_waiting_unit: each additional 30 minutes
    flexible_hourly_cleaning:
      positioning:
        fixed_price_remains_primary: true
        principle: Fixed-price cleaning purchases an agreed outcome and scope. Flexible Hourly Cleaning 
          purchases professional cleaner time.
      rates:
        one_cleaner:
          hourly_rate_gbp: 40
          minimum_hours: 2
          minimum_booking_value_gbp: 80
        two_cleaners:
          combined_hourly_rate_gbp: 75
          minimum_hours: 2
          minimum_booking_value_gbp: 150
      new_customer_discount_eligible: true
      discount_rule: Apply 15% to the booked cleaner-time charge only for a verified new client. Do not 
        discount travel, same-day, parking, congestion or other charges.
      payment_required_percentage: 100
      payment_due: At booking before confirmation.
      travel_rules_apply: true
      same_day_charge_applies: true
      parking_and_congestion: Charged at cost where applicable.
      customer_priority_list_required: true
      tasks_completed_in_priority_order: true
      whole_list_completion_guaranteed: false
      work_stops_at_booked_time: true
      unused_time_rolls_over: false
      additional_time_rule: Requires customer approval, operational availability and payment before the 
        extension begins.
      not_suitable_for:
        - A guaranteed full-property outcome where the purchased time is insufficient
        - End of Tenancy Cleaning
        - Unsafe, specialist or out-of-scope work
  service_area:
    customer_facing_coverage: Whole of London
    origin_postcodes:
      - BR1 5HP
      - RM10 8BE
    distance_method: Calculate one-way driving distance from both origins and use the shorter distance.
    bands:
      - minimum_miles: 0
        maximum_miles: 10
        travel_fee_gbp: 0
        review: false
      - minimum_miles_exclusive: 10
        maximum_miles: 20
        travel_fee_gbp: 10
        review: false
      - minimum_miles_exclusive: 20
        maximum_miles: 30
        travel_fee_gbp: 20
        review: false
      - minimum_miles_exclusive: 30
        travel_fee: manual
        review: true
    outside_area_action: Manual review, not automatic rejection
    unknown_distance_action: Manual review
    applies_to:
      - Residential Whole Property
      - Residential Selected Rooms
      - Airbnb Turnover
      - Other services where travel is chargeable under the approved quotation
    selected_rooms_rule: Selected Rooms uses the normal travel bands. The £40 Hallway/Stairs-only minimum is a
      cleaning-price adjustment applied before travel and does not replace, reduce or include the travel fee.
  booking_windows:
    minimum_notice_hours: 3
    maximum_advance_booking_days: 90
    same_day:
      allowed: true
      subject_to_availability: true
      manual_review: true
    preferred_time:
      quote_stage: Customer may request a preferred arrival window; it is not guaranteed until approval.
      suggested_windows:
        - 08:00-11:00
        - 11:00-14:00
        - 14:00-17:00
        - 17:00-20:00
      same_day_windows: The same four arrival windows may be requested for same-day bookings, subject to the 
        minimum-notice, availability and manual-review rules.
      after_20_00: Manual assessment required; do not show a later standard selectable window.
      outside_windows: Manual request
    sunday:
      cleaning_bookings_accepted: true
      customer_service_hours: 14:00-20:00
    monday_to_saturday_customer_service_hours: 06:00-20:00
    bank_holidays:
      bookings_accepted: true
      subject_to_staff_availability: true
      manual_review: true
      surcharge: No automatic surcharge until separately approved
  planning_durations:
    unit: cleaner-hours unless a team size is specified
    standard_clean:
      studio_or_1_bedroom: 2
      2_bedrooms: 3
      3_bedrooms: 3-4
      4_plus: Calculated during review
    deep_clean:
      studio_or_1_bedroom: 4-5
      2_bedrooms: 5-6
      3_bedrooms: 6-8
      4_plus: Manual review
    airbnb_turnover:
      studio_or_1_bedroom: 1.5
      2_bedrooms: 2-2.5
      3_bedrooms: 3-3.5
      4_plus: Manual review
    end_of_tenancy: Set during manual review
    rule: Durations are planning estimates and must be refined using completed-job data.
  approval:
    always_manual_review:
      - Every new customer's first quote
      - End of Tenancy
      - Commercial cleaning
      - Property Support
      - Dirty Airbnb turnover — provisional £20 fee, photos required and revisable
      - Same-day booking
      - 4+ bedroom property
      - More than 30 miles from both origin postcodes
      - Unknown service-area distance
      - Unsafe-condition warning
      - Hoarding, sharps, biohazards, pests or heavy mould
      - Unusual customer notes
      - Required photos missing
      - Price manually adjusted
      - Bank-holiday booking
    existing_customer_auto_approval_eligible_when_all_true:
      - Customer account is verified and not blacklisted
      - Property is already verified or has no material changes
      - Service is Standard, Deep or normal Airbnb Turnover; Selected Rooms is treated as a scope within 
        Standard or Deep
      - Property is within 30 miles
      - No manual-review trigger exists
      - Requested date has capacity
      - Quote calculation completed without errors
    precedence_rule: The strictest rule wins; an exception always overrides auto-approval.
    outcomes:
      - Approved
      - More Information Required
      - Rejected
      - Revised Quote
  customers:
    existing_customers: May skip verification only when all auto-approval conditions are met
    new_customers: First quote requires review. First eligible service receives the 15% new-client discount 
      under the current discount rules.
    blacklist:
      enabled: true
      triggers:
        - Repeated non-payment
        - Repeated no-access incidents
        - Abusive or unsafe behaviour
        - Fraud or chargeback abuse
        - Repeated serious policy breaches
      effect: Block automatic quoting/booking and require admin review or rejection
    monthly_invoicing:
      eligible: Approved repeat customers only
      deposit_waived: false
      upfront_payment_still_required: true
      remaining_balance: May be included in the approved monthly invoice
      default_terms_days: 14
  payments:
    methods:
      - Card
      - Secure online payment link
    cash: false
    upfront_payment_rules:
      - condition: Normal booking made at least 24 hours before the earliest confirmed arrival-window time
        percentage: 50
      - condition: Same-day booking
        percentage: 100
      - condition: Booking made less than 24 hours before the earliest confirmed arrival-window time
        percentage: 100
      - condition: Flexible Hourly Cleaning
        percentage: 100
      - condition: Approved commercial, recurring-client or other written credit terms
        percentage: As explicitly approved; otherwise use the normal 50% rule
    lead_time_basis: Measure booking lead time to the earliest time in the confirmed arrival window in 
      Europe/London.
    remaining_balance_due: On the service date, no later than two hours before the earliest time in the 
      confirmed arrival window.
    confirmation_rule: A booking is not confirmed until the required upfront payment clears.
    payment_failures:
      upfront_failure: Keep the quote approved but do not confirm or reserve the booking.
      balance_failure: Notify customer and admin. The booking may be paused or cancelled through management 
        review.
    late_payment:
      scope: Approved commercial invoices, recurring-client credit terms or explicitly authorised exceptions 
        only.
      grace_period_calendar_days: 7
      charge_percentage: 2
      calculation_basis: Outstanding balance
      frequency: Each completed seven-day period after the grace period
      compounding: false
      future_bookings_may_be_suspended: true
      legal_review_required: true
    refund_rule: Refunds and retained amounts follow the cancellation and no-access policy and must be 
      recorded against the payment and booking.
  cancellation_and_rescheduling:
    cancellation:
      - notice: At least 48 hours before the earliest confirmed arrival-window time
        charge: No cancellation charge; refund applicable customer payments.
      - notice: Less than 48 hours before the earliest confirmed arrival-window time
        charge: Retain 50% of the full booking value. If only the normal 50% upfront payment was paid, it is 
          retained. If 100% was paid, refund the remaining 50%.
    rescheduling:
      standard_entitlement: One no-fee reschedule with at least 48 hours notice, subject to availability. 
        Transfer the existing deposit or payment to the replacement booking.
      late_or_repeated_request:
        status: awaiting_confirmation
        management_review_required: true
        recommended_standard: Retain 50% of the original booking value for the lost capacity. Apply any amount
          already paid above that retained 50% as credit toward the replacement booking. The replacement 
          booking must then meet the current upfront-payment requirement.
        possible_outcomes:
          - Approve a full payment transfer as a documented exception
          - Apply the recommended late-reschedule treatment
          - Decline the reschedule and treat the request as a cancellation
        review_factors:
          - Amount of notice provided
          - Whether cleaners were assigned or had begun travel or preparation
          - Whether the original capacity can be recovered with another booking
          - Reason supplied and any supporting evidence
          - Customer history, previous reschedules and previous no-access events
          - Availability of a suitable replacement date
          - Fairness, consistency and any safety or emergency circumstances
        recording_required: true
        authorised_roles:
          - Founder
          - Authorised manager
    no_access:
      wait_minutes: 30
      charge: May retain 100% of the full booking value when access cannot be gained because of a 
        customer-side access failure.
      examples:
        - No answer
        - Incorrect access code
        - Unavailable keys
        - Inaccessible lockbox
        - Building entry denied because of customer instructions
      evidence_required: Record attempted contact, arrival time, waiting period and relevant access evidence.
    company_cancellation: Offer a suitable alternative date or cleaner. If Clean Up Central cannot fulfil the 
      service and no alternative is accepted, refund applicable customer payments.
