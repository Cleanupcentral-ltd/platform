name: Evidence Review layout validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ops-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops-console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
