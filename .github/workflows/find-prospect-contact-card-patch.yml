name: Find prospect contact-card patch

on:
  push:
    branches:
      - agent/find-prospect-contact-card-aesthetic

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Find Prospects contact-card aesthetic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/find-prospect-contact-card-aesthetic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python backend/scripts/apply-find-prospect-contact-card-patch.py
      - name: Commit patched files
        run: |
          git config user.name "cleanupcentral-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src ops-console/src
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Apply Find Prospects contact-card aesthetic"
          git push origin HEAD:agent/find-prospect-contact-card-aesthetic
