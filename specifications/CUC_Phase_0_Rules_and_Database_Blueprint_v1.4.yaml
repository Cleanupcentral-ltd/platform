  business_logic:
    - rule: Residential branch
      logic: IF quote_category = Residential Cleaning THEN ask House or Flat/Apartment, then ask Standard, 
        Deep or End of Tenancy.
    - rule: Residential cleaning scope
      logic: 'IF service = Standard OR Deep THEN require exactly one cleaning_scope: Whole Property or Selected
        Rooms.'
    - rule: Selected Rooms
      logic: IF cleaning_scope = Selected Rooms THEN inherit the chosen Standard or Deep level, multiply each 
        room quantity by its matching price, add line totals, and do not add an additional-bathroom fee. IF 
        the selection consists exclusively of Hallways and/or Stairs and its line total is below £40, add the 
        difference to reach £40. IF any Bathroom, Bedroom, Kitchen or Living Room is selected, do not apply a 
        minimum. IF the customer is verified new, apply 15% to the resulting cleaning subtotal before extras, 
        travel and same-day charges. Apply normal travel rules in all cases.
    - rule: End-of-tenancy branch
      logic: IF service = End of Tenancy THEN skip the scope question, require relevant details and photos, 
        hide extras and instant pricing, show Custom Quotation Required and set Under Review.
    - rule: Commercial branch
      logic: IF quote_category = Commercial Cleaning THEN bypass instant pricing and create a custom quotation
        request under review. IF Recurring is selected THEN offer Daily, Five times weekly, Three times 
        weekly, Twice weekly, Weekly, Fortnightly, Monthly, Ad hoc and Other / Not sure.
    - rule: Property Support branch
      logic: IF quote_category = Property Support THEN collect support-service, property, responsibility, 
        frequency, access, urgency and supporting-information details; hide instant pricing and deposit 
        estimates; create a custom quotation request under review. Offer Key Holding, Property Inspection, 
        Contractor Access, Inventory Check, Emergency Attendance and Not Sure only. Collect Occupied, Vacant, 
        Short-let / holiday let or Other / not sure status. Do not offer or imply specialist or 
        outsourced-supplier services.
    - rule: Preferred arrival windows
      logic: Offer 08:00-11:00, 11:00-14:00, 14:00-17:00 and 17:00-20:00, including for same-day requests. 
        Same-day requests remain subject to minimum notice, availability and manual review. Any request after 
        20:00 requires manual assessment and is not a standard selectable window.
    - rule: Airbnb base
      logic: IF quote_category = Airbnb Turnover THEN use the Standard Clean base price for the selected 
        property size and add the chosen condition fee.
    - rule: Dirty Airbnb
      logic: IF Airbnb condition = Dirty THEN add a provisional £20 condition fee, require photos, set manual 
        review, label the estimate provisional and allow the charge to be revised based on severity.
    - rule: Bathrooms
      logic: IF cleaning_scope = Whole Property AND bathroom_count > 1 THEN add (bathroom_count - 1) × £20. IF
        cleaning_scope = Selected Rooms THEN each bathroom is priced individually and no separate bathroom fee
        applies.
    - rule: Booking system
      logic: Ignore all BookingKoala references. Use the exported React application as the customer-facing 
        frontend and Wix-managed Headless with Wix business services as the backend. Do not rebuild the quote 
        generator as a Wix Studio Multi-State Box.
    - rule: Service area
      logic: Calculate distance from BR1 5HP and RM10 8BE; use the shorter one-way driving distance and apply 
        the matching band.
    - rule: Outside service area
      logic: IF shorter distance > 30 miles OR distance unavailable THEN set manual review; do not reject 
        automatically.
    - rule: New customer
      logic: IF customer is new THEN set manual review and apply the 15% first-service discount to the
        eligible cleaning-service charge. Automatically priced Whole Property, Airbnb and approved Flexible
        Hourly calculations apply it directly. Selected Rooms is excluded. Custom-quoted services include it
        manually. Do not discount extras, Airbnb condition fees, travel, same-day, parking, congestion, tolls,
        consumables or separately approved costs.
    - rule: Existing customer
      logic: IF existing and verified AND no exception exists THEN quote may be auto-approved.
    - rule: Payment
      logic: Use a 50% normal upfront payment. Require 100% for same-day bookings, bookings made less than 24 
        hours before the earliest confirmed arrival-window time, and Flexible Hourly Cleaning. Any remaining 
        balance is due on the service date no later than two hours before the earliest confirmed 
        arrival-window time. Confirm only after required upfront payment clears.
    - rule: Quote conversion
      logic: IF quote_status = Approved AND required upfront payment = Paid THEN create booking and set 
        quote_status = Converted to Booking.
    - rule: Unsafe conditions
      logic: IF biohazard, sharps, hoarding, pests, heavy mould or other unsafe condition is reported THEN 
        block auto-approval and escalate for review or rejection.
    - rule: No access
      logic: IF the cleaner cannot gain access because of a customer-side access failure THEN wait and attempt
        contact for 30 minutes, record evidence and escalate. Clean Up Central may retain 100% of the booking 
        value.
  phase_0_acceptance_criteria:
    complete_when:
      - The four top-level quote categories are documented
      - Residential Standard and Deep support mutually exclusive Whole Property or Selected Rooms scopes
      - Selected Rooms prices are exact and quantity-based, with Hallways and Stairs priced separately
      - The £40 Selected Rooms minimum applies only to bookings consisting exclusively of Hallways and/or 
        Stairs; selecting any Bathroom, Bedroom, Kitchen or Living Room disables that minimum
      - Selected Rooms uses normal travel rules and no separate additional-bathroom charge
      - End of Tenancy, Commercial Cleaning and Property Support are separated as manual-quotation journeys
      - Commercial recurring requests offer all nine approved frequency options
      - Property Support collects an approved occupancy status and does not offer specialist or 
        outsourced-supplier services
      - The four approved arrival windows include 17:00-20:00; later requests require manual assessment
      - Every automatically priced item has an exact rule
      - Dirty Airbnb uses a provisional £20 fee, required photos and mandatory manual review
      - The Standard Consumables Package and £20 purchasing allowance are documented
      - Property Support internal base pricing is documented
      - Discount, distance, upfront-payment and balance ordering is documented
      - Manual-review triggers are deterministic
      - Quote, booking and payment statuses are separate
      - Database collections and relationships are defined
      - Historical quote prices are protected by snapshots and pricing versions
      - No BookingKoala dependency remains in the blueprint
      - Verified new clients receive the 15% first-service discount on eligible cleaning-service charges,
        excluding Selected Rooms; approved Flexible Hourly Cleaning remains eligible
      - Normal upfront payment is 50%; same-day, under-24-hour and Flexible Hourly bookings require 100%
      - Remaining-balance deadline is two hours before the earliest confirmed arrival-window time on the 
        service date
      - No-access waiting time is 30 minutes and evidence requirements are documented
      - Flexible Hourly Cleaning rates, two-hour minimum, priority-list model and full-payment rule are 
        documented
    result: 'Phase 0 v1.4 approved as the Build 1 maintenance authority. Production closure requires code, CMS copy
      and controlled quote verification.'
    production_verification_required:
      - Frontend and backend pricing versions report CUC Phase 0 v1.4
      - Normal instant quote records a 50% required upfront payment
      - Under-24-hour or same-day instant quote records 100% required upfront payment
      - New-customer Selected Rooms quote records no discount
      - Wix FAQ payment copy is updated from 30% to the approved payment rules
      - No-access policy is carried into Build 2 booking operations; Build 1 has no runtime no-access workflow
  approved_maintenance_decisions_2026_08_03:
    status: approved
    decisions:
      - Use Founder Operations Handbook v3 prices; End of Tenancy remains custom quoted.
      - Normal upfront payment is 50%; same-day and under-24-hour bookings require 100%.
      - Flexible Hourly Cleaning requires 100% payment at booking.
      - Remaining balance is due on the service date two hours before the earliest confirmed arrival-window 
        time.
      - Hallway and Stairs remain separately priced with a £40 minimum when booked alone.
      - The £20 consumables charge purchases the defined standard package; internal target cost is 
        approximately £10.
      - Cancellation at least 48 hours ahead has no charge; cancellation under 48 hours retains 50% of the 
        full booking value.
      - No access uses a 30-minute wait and may retain 100% of the booking value.
      - Late-payment rule applies after a seven-day grace period at 2% per completed week, non-compounding, to
        approved credit arrangements only.
      - Eligible new clients receive the 15% first-service discount; Selected Rooms is excluded.
      - Authority is governed by subject, with a Decision Log bridging newly approved decisions until 
        documents are synchronised.
    open_decision: Final late or repeated rescheduling treatment remains awaiting confirmation.
