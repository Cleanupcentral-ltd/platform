name: Find prospect contact-card validation

on:
  push:
    branches:
      - agent/find-prospect-contact-card-aesthetic

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  ops-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ops-console/package-lock.json
      - run: npm ci
      - run: npm test
