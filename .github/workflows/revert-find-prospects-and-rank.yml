name: Revert Find Prospects and rank results

on:
  push:
    branches:
      - agent/revert-find-prospects-and-rank

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'Restore compact Find Prospects and rank results'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revert-find-prospects-and-rank
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ops-console/package-lock.json
      - name: Restore pre-editorial Find Prospects
        run: |
          git show 937d3922be691897cf03f50f207b46909b9d4446:ops-console/src/LeadDiscoveryView.tsx > ops-console/src/LeadDiscoveryView.tsx
          git show 937d3922be691897cf03f50f207b46909b9d4446:ops-console/src/LeadEngineRedesign.tsx > ops-console/src/LeadEngineRedesign.tsx
          rm -f ops-console/src/lead-discovery-editorial.css
      - name: Add search-mode ranking
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ops-console/src/LeadDiscoveryView.tsx')
          s = p.read_text()
          old = '''    }).filter(\n      (row) =>\n        resultFilter === "all" ||\n        row.viewState === resultFilter,\n    ),\n    [results, prospects, resultFilter],\n  );'''
          new = '''    }).filter(\n      (row) =>\n        resultFilter === "all" ||\n        row.viewState === resultFilter,\n    ).sort((left, right) => {\n      if (searchMode === "postcode") {\n        const leftDistance =\n          left.result.distanceMiles ??\n          Number.POSITIVE_INFINITY;\n        const rightDistance =\n          right.result.distanceMiles ??\n          Number.POSITIVE_INFINITY;\n        if (leftDistance !== rightDistance) {\n          return leftDistance - rightDistance;\n        }\n        return score(right.prospect) -\n          score(left.prospect);\n      }\n\n      const leftReady =\n        left.prospect !== null &&\n        queueKey(left.prospect) === "ready";\n      const rightReady =\n        right.prospect !== null &&\n        queueKey(right.prospect) === "ready";\n      if (leftReady !== rightReady) {\n        return leftReady ? -1 : 1;\n      }\n\n      const scoreDifference =\n        score(right.prospect) -\n        score(left.prospect);\n      if (scoreDifference !== 0) {\n        return scoreDifference;\n      }\n\n      return left.result.businessName.localeCompare(\n        right.result.businessName,\n      );\n    }),\n    [\n      results,\n      prospects,\n      resultFilter,\n      searchMode,\n    ],\n  );'''
          if s.count(old) != 1:
              raise SystemExit('Expected resultRows block not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate Ops Console
        working-directory: ops-console
        run: |
          npm ci
          npm test
      - name: Commit product changes
        run: |
          git config user.name "cleanupcentral-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A ops-console/src/LeadDiscoveryView.tsx ops-console/src/LeadEngineRedesign.tsx ops-console/src/lead-discovery-editorial.css
          git commit -m "Restore compact Find Prospects and rank results"
          git push origin HEAD:agent/revert-find-prospects-and-rank
