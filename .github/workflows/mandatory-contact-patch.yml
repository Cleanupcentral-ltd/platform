name: Mandatory contact patch

on:
  push:
    branches:
      - agent/mandatory-contact-information

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply mandatory contact information patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mandatory-contact-information
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python backend/scripts/apply-mandatory-contact-patch.py
      - name: Commit patched files
        run: |
          git config user.name "cleanupcentral-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src ops-console/src
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Apply mandatory contact information patch"
          git push origin HEAD:agent/mandatory-contact-information
