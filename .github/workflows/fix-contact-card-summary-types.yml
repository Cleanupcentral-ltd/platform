name: Fix contact-card summary compatibility

on:
  push:
    branches:
      - agent/find-prospect-contact-card-aesthetic

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Make contact summary fields backwards compatible'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/find-prospect-contact-card-aesthetic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make summary fields optional
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'backend/src/ports/lead-review.ts',
              'ops-console/src/lead-review-api.ts',
          ]:
              path = Path(name)
              text = path.read_text()
              old = '  readonly publicPhone: string | null;\n  readonly publicEmail: string | null;'
              new = '  readonly publicPhone?: string | null;\n  readonly publicEmail?: string | null;'
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one contact summary field pair')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name "cleanupcentral-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/ports/lead-review.ts ops-console/src/lead-review-api.ts
          git commit -m "Make contact summary fields backwards compatible"
          git push origin HEAD:agent/find-prospect-contact-card-aesthetic
